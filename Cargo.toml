[package]
name = "freemap"
version = "0.0.1"
edition = "2021"
description = "Trajectory-based long-read aligner with DP-free CIGAR generation"
license = "MIT"
authors = ["Andrea de Ruvo <andrea.deruvo@gssi.it>"]
repository = "https://github.com/genpat-it/freemap"
keywords = ["bioinformatics", "alignment", "long-reads", "minimap2"]
categories = ["science", "command-line-utilities"]

[dependencies]
rayon = "1.10"
bincode = "1.3"
rustc-hash = "2.0"  # FxHashMap - faster hashing
mimalloc = { version = "0.1", default-features = false }
memmap2 = "0.9"  # Memory-mapped files for fast index loading
crossbeam-channel = "0.5"  # Lock-free channels for streaming FASTQ
smallvec = "1.13"  # Stack-allocated small vectors for anchors
needletail = "0.5"  # Fast FASTA/FASTQ parsing (2-3× faster than custom parser)
itoa = "1.0"  # Fast integer-to-string conversion for CIGAR
flate2 = "1"  # gzip decompression for .gz FASTQ/FASTA inputs

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
